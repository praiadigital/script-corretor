<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Script Corretor IA — scripts de venda prontos | Praia Digital</title><meta name="description" content="Scripts de venda e respostas a objeções para corretores de imóveis do litoral: WhatsApp, visita e fechamento."><link rel="canonical" href="https://praia.digital/script-corretor/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:780px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem}textarea{width:100%;min-height:200px;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:.95rem;box-sizing:border-box;margin-top:14px}button{background:#0ea5e9;color:#fff;border:0;padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>🎤 Script Corretor IA</h1><p>Scripts prontos de venda e quebra de objeções para imóveis no litoral.</p></header><main class="container"><div class="card"><select id="tipo" onchange="gerar()"><option value="abordagem">📱 Primeira abordagem (WhatsApp)</option><option value="caro">💰 Objeção: “Está caro”</option><option value="pensar">🤔 Objeção: “Vou pensar”</option><option value="temporada">🏖️ Vendendo o potencial de temporada</option><option value="fechamento">🤝 Fechamento</option><option value="pos">📞 Follow-up pós-visita</option></select><textarea id="msg" readonly></textarea><button onclick="navigator.clipboard.writeText(document.getElementById('msg').value);this.textContent='✅ Copiado!'">Copiar script</button></div><div class="card"><strong>Ferramentas do corretor:</strong><br>🤝 <a class="app" href="https://praia.digital/portal-corretores/">Portal do Corretor</a> — cadastro, Academy e planos<br>🏠 <a class="app" href="https://praia.digital/avaliador-imoveis/">Avaliador de Imóveis</a> — argumente com dados<br>✍️ <a class="app" href="https://praia.digital/gerador-descricoes/">Gerador de Descrições</a> — anúncios que vendem</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>var s={abordagem:'Olá [nome], tudo bem? 😊\n\nSou [seu nome], corretor especialista no litoral. Vi seu interesse no [imóvel] — excelente escolha, essa região valorizou [X]% nos últimos anos.\n\nTenho mais 2 opções no mesmo perfil que ainda não estão nos portais. Posso te mandar?\n\nQuando você pretende vir conhecer? Os fins de semana de [mês] ainda tenho horários.',caro:'Entendo, [nome]. E faz sentido comparar. 👍\n\nDuas coisas importantes: o preço por m² aqui está [X]% abaixo de [bairro vizinho], e imóveis assim ficam em média só [Y] dias no mercado.\n\nAlém disso, com locação de temporada esse imóvel pode gerar R$ [Z]/ano — o rendimento paga boa parte do financiamento.\n\nQue tal uma proposta? O proprietário está aberto a negociar.',pensar:'Claro, [nome], decisão importante mesmo. 🙂\n\nSó para você ter todos os elementos: preparei uma simulação com o custo total (entrada, ITBI, cartório) e o rendimento potencial de temporada.\n\nPosso te mandar agora? Assim você analisa com calma — e se surgir dúvida, me chama. Combinamos de conversar [dia]?',temporada:'[nome], deixa eu te mostrar um número: apartamentos como esse em [cidade] alugam por R$ [X]/noite na alta temporada.\n\nCom 55% de ocupação média, são R$ [Y]/ano — yield de [Z]% ao ano, mais a valorização histórica de [W]% em 5 anos.\n\nVocê usa nos seus fins de semana e o imóvel se paga no resto do ano. Quer que eu monte a simulação completa?',fechamento:'[nome], pelo que conversamos, esse imóvel atende tudo o que você busca: [listar 3 pontos].\n\nA proposta que conversamos de R$ [X] é justa — está dentro da média do bairro e o vendedor aceita [condição].\n\nPodemos reservar hoje com o sinal e agendar a escritura? Tenho o contrato pronto.',pos:'Oi [nome]! Foi um prazer te mostrar o [imóvel] ontem. 🏖️\n\nFicou alguma dúvida? Outras duas pessoas visitaram essa semana, então se fizer sentido para você, vale garantir a prioridade.\n\nPosso preparar uma minuta de proposta sem compromisso?'};function gerar(){document.getElementById('msg').value=s[document.getElementById('tipo').value];}gerar();</script></body></html>
